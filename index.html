<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>λ-dangle</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>λ</text></svg>" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <aside id="left-panel">
      <header>
        <h1>λ-dangle</h1>
        <p class="tagline">the lambda calculus, in the flesh</p>
      </header>
      <div id="presets"></div>
      <div id="input-row">
        <textarea id="term-input" rows="2" spellcheck="false"
          placeholder="type a term… e.g. (λx. x x) (λy. y)"></textarea>
        <button id="load-btn" title="Load term (Enter)">Load</button>
      </div>
      <div id="parse-error" hidden></div>
    </aside>
    <button id="panel-toggle" title="toggle panel">◂</button>

    <div id="top-right">
      <label><input type="checkbox" id="labels-toggle" /> labels</label>
      <label><input type="checkbox" id="tethers-toggle" checked /> bindings</label>
      <label><input type="checkbox" id="autocam-toggle" checked /> auto camera</label>
    </div>

    <div id="bottom-stack">
      <div id="text-panel"><code id="term-text"></code></div>
      <div id="transport">
        <button id="btn-reset" title="back to the starting term">⏮</button>
        <button id="btn-back" title="one step back">◀</button>
        <button id="btn-step" title="one step (chosen strategy)">▶ step</button>
        <button id="btn-run" title="run to normal form (max 1000 steps)">⏵ run</button>
        <select id="strategy" title="strategy for step / run">
          <option value="normal">normal order</option>
          <option value="applicative">applicative order</option>
        </select>
        <label id="speed-label">speed
          <input type="range" id="speed" min="0.25" max="3" step="0.05" value="1" />
        </label>
        <label><input type="checkbox" id="instant-toggle" /> instant</label>
        <span id="step-counter"></span>
        <span id="node-badge"></span>
      </div>
      <div id="message" hidden></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
